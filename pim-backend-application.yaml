## ArgoCD Application for PIM backend
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pim-backend-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/james-rotary/test-initdb.git
    targetRevision: pim-backend-api-config
    path: crdb-minikube/pim-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: pim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
