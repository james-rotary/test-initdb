## ArgoCD Application for CockroachDB single-node deployment
## Syncs manifests in crdb-minikube/ (namespace, services, statefulset, bootstrap SQL)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockroachdb-single-node
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/james-rotary/test-initdb.git
    targetRevision: development
    path: crdb-minikube
  destination:
    server: https://kubernetes.default.svc
    namespace: crdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5