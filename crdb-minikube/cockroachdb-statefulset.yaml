apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: crdb
spec:
  serviceName: cockroachdb
  replicas: 1
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      containers:
        - name: cockroachdb
          image: cockroachdb/cockroach:v23.2.17
          imagePullPolicy: IfNotPresent
          command:
            - "/cockroach/cockroach"
            - "start-single-node"
            - "--insecure"
            - "--store=attrs=ssd,path=/cockroach/cockroach-data"
            - "--logtostderr=INFO"
            - "--listen-addr=0.0.0.0"
            - "--http-addr=0.0.0.0:8080"
            - "--cache=25%"
            - "--max-sql-memory=25%"
          ports:
            - containerPort: 26257
              name: grpc
            - containerPort: 8080
              name: http
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","/cockroach/cockroach sql --insecure -e 'show databases;' > /dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: datadir
              mountPath: /cockroach/cockroach-data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
