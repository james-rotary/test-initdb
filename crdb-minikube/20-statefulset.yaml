apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: crdb
spec:
  serviceName: cockroachdb
  replicas: 1
  selector:
    matchLabels: { app: cockroachdb }
  template:
    metadata:
      labels: { app: cockroachdb }
    spec:
      containers:
        - name: cockroach
          image: cockroachdb/cockroach:v23.2.17
          imagePullPolicy: IfNotPresent
          command:
            - /cockroach/cockroach
            - start-single-node
            - --insecure
            - --store=/cockroach/cockroach-data
            - --http-addr=0.0.0.0:8080
          ports:
            - { name: grpc, containerPort: 26257 }
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /cockroach/cockroach-data }
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
