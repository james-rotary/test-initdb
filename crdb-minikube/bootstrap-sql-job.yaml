## One-off Job that waits for CockroachDB readiness then runs bootstrap SQL
apiVersion: batch/v1
kind: Job
metadata:
  name: cockroachdb-bootstrap-sql
  namespace: crdb
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: cockroachdb/cockroach:v23.2.17
          volumeMounts:
            - name: init-sql
              mountPath: /init
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /cockroach/cockroach sql --insecure --host=cockroachdb-public.crdb.svc.cluster.local -e "select 1"; do
                echo 'waiting for SQL...'; sleep 2;
              done
              /cockroach/cockroach sql --insecure --host=cockroachdb-public.crdb.svc.cluster.local --file=/init/init.sql
      volumes:
        - name: init-sql
          configMap:
            name: bootstrap-sql
            items:
              - key: init.sql
                path: init.sql