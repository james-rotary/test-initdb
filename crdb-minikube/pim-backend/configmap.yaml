## ConfigMap holding non-sensitive environment variables for PIM backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: pim-backend-config
  namespace: pim
data:
  # CockroachDB connection string (insecure local dev). In production move to a Secret.
  DATABASE_URL: "postgresql://root@cockroachdb-public.crdb.svc.cluster.local:26257/testdb?sslmode=disable"
  PORT: "3000"
  SKIP_DB_SEED: "false"
