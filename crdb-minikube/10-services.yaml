apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
  namespace: crdb
  labels: { app: cockroachdb }
spec:
  clusterIP: None
  selector: { app: cockroachdb }
  ports:
    - { name: grpc, port: 26257, targetPort: 26257 }
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
  namespace: crdb
  labels: { app: cockroachdb }
spec:
  selector: { app: cockroachdb }
  ports:
    - { name: grpc, port: 26257, targetPort: 26257 }
    - { name: http, port: 8080, targetPort: 8080 }
